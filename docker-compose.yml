services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: src/WebAPI/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__TodoDb: "Host=postgres;Port=5432;Database=todo;Username=postgres;Password=${POSTGRES_PASSWORD}"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: backend
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    # No ports exposed — only accessible by gateway on the internal network

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: https://+:443;http://+:80
      LettuceEncrypt__DomainNames__0: ${DOMAIN_NAME:?Set DOMAIN_NAME in .env}
      LettuceEncrypt__EmailAddress: admin@${DOMAIN_NAME}
      AllowedHosts: ${DOMAIN_NAME}
      ReverseProxy__Clusters__backend-cluster__Destinations__backend__Address: http://backend:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - le-certs:/app/certs
    depends_on:
      - backend
    networks:
      - internal
      - public

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./docker/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - internal
    # Expose Prometheus metrics endpoint for Grafana
    ports:
      - "127.0.0.1:8889:8889"

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SERVER_HTTP_ADDR: "0.0.0.0"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - otel-collector
    networks:
      - internal
      - public

  loki:
    image: grafana/loki:latest
    networks:
      - internal

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./docker/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    networks:
      - internal

volumes:
  pgdata:
  grafana-data:
  tempo-data:
  le-certs:

networks:
  internal:
    driver: bridge
  public:
    driver: bridge
